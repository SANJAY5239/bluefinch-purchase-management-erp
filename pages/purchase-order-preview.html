<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PO Preview</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><style>
:root{--p:#4b257c;--g:#d9aa3e;--l:#ded5ea}*{box-sizing:border-box}body{margin:0;background:#eeeaf3;font-family:Arial;color:#231a31}.toolbar{position:sticky;top:0;z-index:5;background:#2c154d;padding:10px 3%;display:flex;gap:7px;align-items:center}.toolbar button,.toolbar a{background:#ffffff18;border:1px solid #ffffff55;border-radius:5px;color:#fff;padding:8px 10px;text-decoration:none;cursor:pointer}.toolbar .gold{background:var(--g);color:#231600;border-color:var(--g)}.push{margin-left:auto}.paper{width:210mm;min-height:297mm;margin:24px auto;padding:14mm;background:#fff;box-shadow:0 4px 20px #0002;font-size:11px;line-height:1.45}.paper:focus{outline:3px solid #bba3db}.head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--g);padding-bottom:10px}.brand{display:flex;gap:12px;align-items:flex-start}.brand-logo{width:62px;height:62px;object-fit:contain;flex:0 0 auto}.head h1{margin:0;color:var(--p);font-size:25px}.head p{margin:3px 0;color:#635876}.title{background:var(--p);color:#fff;text-align:center;padding:8px;font-size:20px;font-weight:bold;letter-spacing:2px;margin:14px 0}.grid,.signatures{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box,.terms{border:1px solid var(--l);padding:10px;min-height:105px}.box h3,.terms h3{margin:0 0 6px;color:var(--p);font-size:12px}.label{font-weight:bold;color:#59476f}table{width:100%;border-collapse:collapse;margin:14px 0}th{background:var(--p);color:white}th,td{border:1px solid var(--l);padding:6px;text-align:left;vertical-align:top}td:nth-child(n+3){text-align:right}.totals{width:260px;margin-left:auto}.totals td:last-child{text-align:right}.grand{font-size:13px;font-weight:bold;color:var(--p)}.signature{height:100px;border:1px dashed #9478ba;position:relative;text-align:center}.signature canvas{position:absolute;inset:0;width:100%;height:72px;touch-action:none}.signature img{height:65px;max-width:90%;object-fit:contain}.sig-label{position:absolute;bottom:5px;left:0;right:0;font-weight:bold}.panel{display:none;position:fixed;right:16px;top:70px;width:340px;max-width:calc(100vw - 32px);background:#fff;z-index:10;padding:15px;box-shadow:0 8px 30px #0004}.panel.open{display:block}.tabs button{border:0;background:none;color:var(--p);padding:8px;font-weight:bold}.tabs .active{border-bottom:3px solid var(--g)}.tab{display:none}.tab.active{display:block}.pad{width:100%;height:150px;border:1px solid var(--l);touch-action:none}.panel input,.panel select{width:100%;margin:5px 0 10px;padding:8px}.typed{font-size:30px;min-height:45px}.cursive{font-family:cursive}.formal{font-family:Georgia;font-style:italic}@media(max-width:850px){.paper{width:calc(100% - 16px);padding:7mm}.grid,.signatures{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.push{margin-left:0}.paper table{font-size:8px}th,td{padding:3px}.brand-logo{width:45px;height:45px}}
/* Letterhead logo and company information are intentionally stacked. */
.brand{flex-direction:column;gap:1px}.brand h1{display:none}.brand-logo{width:145px;height:145px;flex:none}@media(max-width:850px){.brand-logo{width:92px;height:92px}}
</style></head><body>
<nav class="toolbar" id="toolbar"><a href="purchase-orders.html">← Back</a><button data-c="bold"><b>B</b></button><button data-c="italic"><i>I</i></button><button data-c="underline"><u>U</u></button><button id="addSig">Add Signature</button><button id="clearSig">Clear Signature</button><button id="reset">Reset</button><span class="push"></span><button class="gold" id="download">Download PDF</button><button id="print">Print</button></nav>
<aside class="panel" id="panel"><div class="tabs"><button class="active" data-t="draw">Draw</button><button data-t="upload">Upload</button><button data-t="type">Type</button></div><div id="draw" class="tab active"><canvas id="pad" class="pad" width="640" height="300"></canvas><button id="clearPad">Clear drawing</button></div><div id="upload" class="tab"><input id="uploadFile" type="file" accept="image/*"></div><div id="type" class="tab"><input id="typeName" placeholder="Your name"><select id="typeStyle"><option value="cursive">Cursive</option><option value="formal">Formal</option><option value="print">Print</option></select><div id="typeView" class="typed cursive"></div></div><label>Apply to</label><select id="target"><option value="buyer">Buyer</option><option value="supplier">Supplier</option></select><button id="apply">Apply signature</button><button id="close">Cancel</button></aside><main id="doc" class="paper" contenteditable="true" spellcheck="true"></main>
<script>
const toolbar=document.getElementById('toolbar'),po=JSON.parse(localStorage.getItem('bluefinchPoPreview')||'null'),doc=document.getElementById('doc'),money=n=>'₹ '+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));if(!po)doc.innerHTML='<h2>Purchase order not found</h2><p>Return to the list and select PDF again.</p>';else{let rows=(po.items||[]).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.description||x.item_code)}</td><td>${esc(x.item_code||'—')}</td><td>${esc(x.quantity)}</td><td>${esc(x.unit)}</td><td>${money(x.unit_price)}</td><td>${esc(x.tax||0)}%</td><td>${money(x.line_total)}</td></tr>`).join('');doc.innerHTML=`<header class="head"><div class="brand"><img class="brand-logo" src="../picture/logo.png" alt="BlueSun logo"><div><h1>BlueSun</h1><b>Bluesun International LLC</b><p><span class="label">Address:</span> Ghala, 250 Way no. 5001, 112, Muscat, Oman<br><span class="label">Phone:</span> +968 22584259 &nbsp; <span class="label">Email:</span> sales@bluesun-om.com<br><span class="label">GSTIN:</span> [To be provided]</p></div></div><p><span class="label">Status:</span> ${esc(po.status)}<br><span class="label">Reference:</span> ${esc(po.reference_number||'—')}</p></header><div class="title">PURCHASE ORDER</div><section class="grid"><div class="box"><h3>Purchase Order Details</h3><span class="label">PO Number:</span> ${esc(po.po_number)}<br><span class="label">PO Date:</span> ${esc(po.po_date)}<br><span class="label">Delivery Date:</span> ${esc(po.expected_delivery_date)}<br><span class="label">Status:</span> ${esc(po.status)}<br><span class="label">Payment Terms:</span> ${esc(po.payment_terms)}</div><div class="box"><h3>Supplier Details</h3><span class="label">Supplier Name:</span> ${esc(po.supplier_name)}<br><span class="label">Contact Person:</span> [Click to add]<br><span class="label">Email:</span> [Click to add]<br><span class="label">Phone:</span> [Click to add]<br><span class="label">GSTIN:</span> [Click to add]</div></section><table><thead><tr><th>#</th><th>Item Description</th><th>HSN Code</th><th>Qty</th><th>Unit</th><th>Unit Price</th><th>GST%</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table><table class="totals"><tr><td>Sub Total</td><td>${money(po.subtotal)}</td></tr><tr><td>GST</td><td>${money(po.total_tax)}</td></tr><tr><td>Discount</td><td>${money(po.total_discount)}</td></tr><tr><td>Shipping</td><td>${money(po.additional_charges)}</td></tr><tr class="grand"><td>Grand Total</td><td>${money(po.grand_total)}</td></tr></table><section class="terms"><h3>Terms and Conditions</h3>${esc(po.notes||'Please supply the above items according to the agreed delivery and payment terms.')}</section><section class="signatures"><div class="signature" data-s="buyer"><span class="sig-label">Buyer Signature</span></div><div class="signature" data-s="supplier"><span class="sig-label">Supplier Signature</span></div></section>`}const original=doc.innerHTML;document.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{document.execCommand(x.dataset.c);doc.focus()});
let active='draw',sig='';const panel=document.getElementById('panel'),pad=document.getElementById('pad'),ctx=pad.getContext('2d');ctx.lineWidth=5;ctx.lineCap='round';let down=false,last;function p(e,c=pad){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}pad.onpointerdown=e=>{down=true;last=p(e);pad.setPointerCapture(e.pointerId)};pad.onpointermove=e=>{if(!down)return;let q=p(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();last=q;sig=pad.toDataURL()};pad.onpointerup=()=>down=false;document.getElementById('clearPad').onclick=()=>{ctx.clearRect(0,0,pad.width,pad.height);sig=''};document.getElementById('addSig').onclick=()=>panel.classList.add('open');document.getElementById('close').onclick=()=>panel.classList.remove('open');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{active=b.dataset.t;document.querySelectorAll('[data-t],.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(active).classList.add('active')});document.getElementById('uploadFile').onchange=e=>{let r=new FileReader();r.onload=()=>sig=r.result;r.readAsDataURL(e.target.files[0])};let n=document.getElementById('typeName'),st=document.getElementById('typeStyle'),v=document.getElementById('typeView');function typed(){v.textContent=n.value;v.className='typed '+st.value}n.oninput=typed;st.onchange=typed;function place(box){box.querySelectorAll('img,.typed,canvas').forEach(x=>x.remove());if(active==='type'){let x=document.createElement('div');x.className='typed '+st.value;x.textContent=n.value||'Signature';box.prepend(x)}else if(sig){let x=document.createElement('img');x.src=sig;box.prepend(x)}}document.getElementById('apply').onclick=()=>{place(document.querySelector(`[data-s="${document.getElementById('target').value}"]`));panel.classList.remove('open')};document.getElementById('clearSig').onclick=()=>document.querySelectorAll('[data-s]').forEach(x=>x.querySelectorAll('img,.typed,canvas').forEach(y=>y.remove()));function direct(box){let c=document.createElement('canvas');c.width=500;c.height=144;box.prepend(c);let x=c.getContext('2d'),d=false,l;x.lineWidth=3;x.lineCap='round';c.onpointerdown=e=>{d=true;l=p(e,c);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!d)return;let q=p(e,c);x.beginPath();x.moveTo(l.x,l.y);x.lineTo(q.x,q.y);x.stroke();l=q};c.onpointerup=()=>d=false}document.querySelectorAll('[data-s]').forEach(x=>x.ondblclick=()=>!x.querySelector('canvas')&&direct(x));document.getElementById('reset').onclick=()=>{if(confirm('Discard all edits?')){doc.innerHTML=original;location.reload()}};document.getElementById('download').onclick=()=>{panel.classList.remove('open');toolbar.style.display='none';html2pdf().set({margin:0,filename:`${po?.po_number||'Purchase-Order'}_BlueSun.pdf`,image:{type:'jpeg',quality:.98},html2canvas:{scale:2},jsPDF:{unit:'mm',format:'a4'}}).from(doc).save().finally(()=>toolbar.style.display='flex')};document.getElementById('print').onclick=()=>{panel.classList.remove('open');window.print()};
</script></body></html>
