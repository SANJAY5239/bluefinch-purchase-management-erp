<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Profile - Bluefinch</title><link rel="stylesheet" href="../assets/css/style.css"><style>.profile{max-width:850px;margin:45px auto;background:#fff;padding:30px;border-radius:14px;box-shadow:0 3px 18px #0001}.profile h1{margin-bottom:6px}.profile p{color:#64748b;margin-bottom:22px}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.profile label{display:block;font-size:13px;font-weight:bold;margin-bottom:5px}.profile input,.profile textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}.profile textarea{min-height:80px}.profile .full{grid-column:1/-1}.logo-preview{max-height:75px;max-width:200px;display:block;margin:8px 0}.actions{display:flex;gap:10px;margin-top:22px}@media(max-width:600px){.profile{margin:20px 12px}.profile-grid{grid-template-columns:1fr}}</style></head><body><main class="profile"><a href="purchase-orders.html">← Purchase Orders</a><h1>Company Profile</h1><p>Changes apply to the next PO preview or PDF. Logo files are validated and stored only as the current company profile asset.</p><form id="form"><div class="profile-grid"><div><label>Display name</label><input name="name"></div><div><label>Legal name</label><input name="legalName"></div><div class="full"><label>Address</label><input name="address"></div><div><label>Phone</label><input name="phone"></div><div><label>Email</label><input name="email" type="email"></div><div><label>Tax ID</label><input name="taxId" placeholder="Leave blank if not applicable"></div><div><label>Website</label><input name="website"></div><div class="full"><label>Terms & conditions</label><textarea name="terms"></textarea></div><div class="full"><label>Footer note</label><input name="footerNote"></div><div class="full"><label>Company logo (PNG/JPEG, max 2MB)</label><img id="logo" class="logo-preview" alt="Current logo"><input id="logoInput" type="file" accept="image/png,image/jpeg"></div></div><div class="actions"><button class="btn btn-primary">Save company profile</button><a class="btn btn-secondary" href="purchase-orders.html">Cancel</a></div></form></main><script src="../assets/js/api.js"></script><script>let currentLogo='';const form=document.getElementById('form'),logo=document.getElementById('logo');(async()=>{const c=(await apiRequest('company_settings.php')).data;Object.keys(c).forEach(k=>{if(form.elements[k])form.elements[k].value=c[k]||''});currentLogo=c.logoData||'../picture/logo.png';logo.src=currentLogo})().catch(e=>alert(e.message));document.getElementById('logoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024)return alert('Logo must be 2MB or smaller.');const r=new FileReader();r.onload=()=>{currentLogo=r.result;logo.src=currentLogo};r.readAsDataURL(f)};form.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));if(currentLogo.startsWith('data:'))data.logoData=currentLogo;try{await apiRequest('company_settings.php',{method:'PUT',body:JSON.stringify(data)});alert('Company profile saved.')}catch(err){alert(err.message)}};</script></body></html>
