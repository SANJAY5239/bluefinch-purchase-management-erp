<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProcureX - Register Account</title>
    <link rel="stylesheet" href="app.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-icon">P</div>
            <div class="brand-text">
                <h2>ProcureX</h2>
                <p>Procurement Management</p>
            </div>
        </div>

        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Register a new procurement manager account</p>

        <form id="registerForm">
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 8px;">
                Register Account
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="login.html">Sign in here</a></p>
        </div>
    </div>

    <script src="sidebar.js"></script>
    <script>
        const API = 'https://YOUR_BACKEND_URL/api.php';

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (password.length < 6) {
                showToast('Password must be at least 6 characters.', true);
                return;
            }

            try {
                const response = await callApi('register', 'POST', { name, email, password, role: 'Procurement Officer' });
                
                if (response.success) {
                    showToast('Account created successfully! Please log in.', false);
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1200);
                }
            } catch (error) {
                // Error toast displayed by callApi
            }
        });
    </script>
</body>
</html>
